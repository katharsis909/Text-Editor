<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Multi-Line Text Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --gutter-bg: #0d1117;
      --gutter-border: #30363d;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --selection: rgba(56, 139, 253, 0.28);
      --cursor: #58a6ff;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --font-mono: 'JetBrains Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* HEADER APP BAR */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.2px;
    }

    .brand-badge {
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      font-family: var(--font-ui);
    }

    .btn:hover:not(:disabled) {
      background: #30363d;
      border-color: #8b949e;
    }

    .btn:active:not(:disabled) {
      background: #282e33;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #238636;
      border-color: rgba(240, 246, 252, 0.1);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #2ea043;
      border-color: rgba(240, 246, 252, 0.1);
    }

    .btn-danger {
      background: rgba(248, 81, 73, 0.15);
      border-color: rgba(248, 81, 73, 0.4);
      color: #f85149;
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(248, 81, 73, 0.3);
    }

    .dev-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .dev-link:hover {
      color: var(--accent);
      background: rgba(88, 166, 255, 0.1);
    }

    /* TOOLBAR */
    .toolbar {
      background: #12161f;
      border-bottom: 1px solid var(--border);
      height: 40px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      flex-shrink: 0;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 4px;
    }

    .zoom-val {
      font-family: var(--font-mono);
      font-size: 11px;
      min-width: 38px;
      text-align: center;
      color: var(--text-muted);
    }

    /* MAIN EDITOR AREA */
    .editor-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      outline: none;
    }

    /* LINE NUMBERS GUTTER CANVAS */
    #gutterCanvas {
      background: var(--gutter-bg);
      border-right: 1px solid var(--gutter-border);
      flex-shrink: 0;
      display: block;
    }

    /* TEXT CONTENT CANVAS */
    #textCanvas {
      flex: 1;
      background: var(--bg);
      display: block;
      cursor: text;
    }

    /* SCROLLBARS */
    .v-scrollbar {
      position: absolute;
      top: 0;
      right: 0;
      width: 10px;
      bottom: 0;
      background: rgba(255, 255, 255, 0.02);
      z-index: 10;
    }

    .v-thumb {
      position: absolute;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      cursor: pointer;
    }

    .v-thumb:hover, .v-thumb.dragging {
      background: rgba(255, 255, 255, 0.35);
    }

    /* STATUS FOOTER */
    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      height: 28px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      flex-shrink: 0;
    }

    .status-items {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-highlight {
      color: var(--accent);
      font-weight: 500;
    }

    .toast {
      color: var(--text);
      transition: opacity 0.3s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 450px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      <span>Text Editor</span>
      <span class="brand-badge">Piece Table Multi-Line</span>
    </div>

    <div class="top-actions">
      <button id="btnUndo" class="btn" title="Undo (Ctrl/Cmd+Z)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
        Undo
      </button>
      <button id="btnRedo" class="btn" title="Redo (Ctrl+Y or Ctrl+Shift+Z)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path></svg>
        Redo
      </button>

      <button id="btnDelete" class="btn btn-danger" disabled title="Delete selection (Backspace/Delete)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Delete
      </button>

      <div class="toolbar-sep"></div>

      <a href="dev.html" class="dev-link" target="_blank" title="Open low-level Piece Directory & Memory Inspector">
        Inspect Piece Table &rarr;
      </a>
    </div>
  </header>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-group">
      <button id="btnZoomOut" class="btn" style="padding: 2px 7px;">-</button>
      <span id="lblZoom" class="zoom-val">16px</span>
      <button id="btnZoomIn" class="btn" style="padding: 2px 7px;">+</button>
    </div>

    <div class="toolbar-sep"></div>

    <div class="toolbar-group" style="color: var(--text-muted);">
      <span>Shortcuts:</span>
      <span style="color:var(--text); font-family:var(--font-mono); font-size:11px;">Arrows (Navigate)</span> &bull;
      <span style="color:var(--text); font-family:var(--font-mono); font-size:11px;">Enter (New Line)</span> &bull;
      <span style="color:var(--text); font-family:var(--font-mono); font-size:11px;">Shift+Arrows (Select)</span> &bull;
      <span style="color:var(--text); font-family:var(--font-mono); font-size:11px;">Ctrl+Home/End (Jump)</span>
    </div>
  </div>

  <!-- EDITOR CANVAS VIEWPORT -->
  <div class="editor-container" id="editorContainer" tabindex="0">
    <canvas id="gutterCanvas" width="60"></canvas>
    <canvas id="textCanvas"></canvas>

    <div class="v-scrollbar" id="vScrollbar">
      <div class="v-thumb" id="vThumb"></div>
    </div>
  </div>

  <!-- STATUS FOOTER -->
  <footer>
    <div class="status-items">
      <div id="statCursor">Ln 1, Col 1 (Pos #0)</div>
      <div id="statSelection" style="display:none;" class="status-highlight">0 selected</div>
      <div id="statDoc">Lines: 1 | Chars: 0</div>
    </div>
    <div class="toast" id="toastMsg">Ready</div>
  </footer>

  <script>
    const BACKEND_URL = "http://localhost:8081/api/piecetable";
    const FONT_FAMILY = "'JetBrains Mono', 'Menlo', 'Monaco', 'Courier New', monospace";

    // Application State
    const state = {
      fullText: "",
      lines: [""],
      lineStartOffsets: [0],
      totalChars: 0,

      // Font & Metrics
      fontSize: 16,
      lineHeight: 24,
      charWidth: 9.6,
      gutterWidth: 60,
      dpr: window.devicePixelRatio || 1,

      // Scroll Offsets
      scrollX: 0,
      scrollY: 0,

      // Selection & Cursor
      // Anchor & Focus are global character indices [0 .. totalChars]
      selectionAnchor: 0,
      selectionFocus: 0,
      isSelecting: false,

      // Server status
      isBusy: false
    };

    // DOM Elements
    const editorContainer = document.getElementById('editorContainer');
    const gutterCanvas = document.getElementById('gutterCanvas');
    const textCanvas = document.getElementById('textCanvas');
    const gutterCtx = gutterCanvas.getContext('2d');
    const textCtx = textCanvas.getContext('2d');

    const vScrollbar = document.getElementById('vScrollbar');
    const vThumb = document.getElementById('vThumb');

    const btnUndo = document.getElementById('btnUndo');
    const btnRedo = document.getElementById('btnRedo');
    const btnDelete = document.getElementById('btnDelete');
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const lblZoom = document.getElementById('lblZoom');

    const statCursor = document.getElementById('statCursor');
    const statSelection = document.getElementById('statSelection');
    const statDoc = document.getElementById('statDoc');
    const toastMsg = document.getElementById('toastMsg');

    function showToast(msg) {
      toastMsg.textContent = msg;
    }

    // --- 1. FONT METRICS & LINE BREAK INDEXING ---
    function measureFont() {
      const probeCanvas = document.createElement('canvas');
      const ctx = probeCanvas.getContext('2d');
      ctx.font = `${state.fontSize}px ${FONT_FAMILY}`;
      state.charWidth = ctx.measureText("M".repeat(100)).width / 100;
      state.lineHeight = Math.round(state.fontSize * 1.5);
      lblZoom.textContent = `${state.fontSize}px`;
    }

    function reindexLines() {
      const text = state.fullText;
      const lines = [];
      const offsets = [0];

      let start = 0;
      for (let i = 0; i < text.length; i++) {
        if (text[i] === '\n') {
          lines.push(text.substring(start, i));
          start = i + 1;
          offsets.push(start);
        }
      }
      lines.push(text.substring(start));

      state.lines = lines;
      state.lineStartOffsets = offsets;
      state.totalChars = text.length;

      // Adjust gutter width based on total lines
      const maxDigits = Math.max(3, String(lines.length).length);
      state.gutterWidth = Math.max(50, (maxDigits * 8.5) + 24);

      statDoc.textContent = `Lines: ${lines.length.toLocaleString()} | Chars: ${state.totalChars.toLocaleString()}`;
    }

    // Coordinate conversions: Global Index <-> (Line, Column)
    function indexToLineCol(index) {
      index = Math.max(0, Math.min(state.totalChars, index));
      const offsets = state.lineStartOffsets;

      let low = 0, high = offsets.length - 1, lineIdx = 0;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (offsets[mid] <= index) {
          lineIdx = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      const col = index - offsets[lineIdx];
      return { line: lineIdx, col: col };
    }

    function lineColToIndex(line, col) {
      line = Math.max(0, Math.min(state.lines.length - 1, line));
      const lineLen = state.lines[line].length;
      col = Math.max(0, Math.min(lineLen, col));
      return state.lineStartOffsets[line] + col;
    }

    function getSelectionRange() {
      const start = Math.min(state.selectionAnchor, state.selectionFocus);
      const end = Math.max(state.selectionAnchor, state.selectionFocus);
      return { start, end, length: end - start };
    }

    // --- 2. CANVAS RENDERING & VIRTUAL VIEWPORT ---
    function resizeCanvases() {
      state.dpr = window.devicePixelRatio || 1;
      const rect = editorContainer.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      gutterCanvas.width = state.gutterWidth * state.dpr;
      gutterCanvas.height = h * state.dpr;
      gutterCanvas.style.width = `${state.gutterWidth}px`;
      gutterCanvas.style.height = `${h}px`;

      const textWidth = Math.max(10, w - state.gutterWidth);
      textCanvas.width = textWidth * state.dpr;
      textCanvas.height = h * state.dpr;
      textCanvas.style.width = `${textWidth}px`;
      textCanvas.style.height = `${h}px`;

      gutterCtx.resetTransform();
      gutterCtx.scale(state.dpr, state.dpr);
      textCtx.resetTransform();
      textCtx.scale(state.dpr, state.dpr);

      clampScroll();
      render();
    }

    function getMaxScrollY() {
      const totalHeight = (state.lines.length * state.lineHeight) + 120;
      const viewHeight = editorContainer.clientHeight;
      return Math.max(0, totalHeight - viewHeight);
    }

    function getMaxScrollX() {
      // Find approximate max line width
      let maxCols = 80;
      for (let i = 0; i < Math.min(200, state.lines.length); i++) {
        if (state.lines[i].length > maxCols) maxCols = state.lines[i].length;
      }
      const totalWidth = (maxCols * state.charWidth) + 100;
      const viewWidth = textCanvas.clientWidth;
      return Math.max(0, totalWidth - viewWidth);
    }

    function clampScroll() {
      state.scrollY = Math.max(0, Math.min(getMaxScrollY(), state.scrollY));
      state.scrollX = Math.max(0, Math.min(getMaxScrollX(), state.scrollX));
      updateScrollbar();
    }

    function updateScrollbar() {
      const viewHeight = editorContainer.clientHeight;
      const totalHeight = (state.lines.length * state.lineHeight) + 120;
      if (totalHeight <= viewHeight) {
        vThumb.style.display = 'none';
        return;
      }
      vThumb.style.display = 'block';
      const thumbHeight = Math.max(28, (viewHeight / totalHeight) * viewHeight);
      const maxScroll = getMaxScrollY();
      const top = maxScroll > 0 ? (state.scrollY / maxScroll) * (viewHeight - thumbHeight) : 0;
      vThumb.style.height = `${thumbHeight}px`;
      vThumb.style.transform = `translateY(${top}px)`;
    }

    function ensureCursorVisible() {
      const { line, col } = indexToLineCol(state.selectionFocus);
      const cursorY = line * state.lineHeight;
      const cursorX = col * state.charWidth;

      const viewHeight = editorContainer.clientHeight;
      const viewWidth = textCanvas.clientWidth;

      if (cursorY < state.scrollY) {
        state.scrollY = cursorY;
      } else if (cursorY + state.lineHeight > state.scrollY + viewHeight - 20) {
        state.scrollY = cursorY + state.lineHeight - viewHeight + 20;
      }

      if (cursorX < state.scrollX) {
        state.scrollX = Math.max(0, cursorX - 40);
      } else if (cursorX > state.scrollX + viewWidth - 50) {
        state.scrollX = cursorX - viewWidth + 50;
      }

      clampScroll();
    }

    function render() {
      const viewHeight = editorContainer.clientHeight;
      const textWidth = textCanvas.clientWidth;

      // 1. Clear canvases
      gutterCtx.fillStyle = "#0d1117";
      gutterCtx.fillRect(0, 0, state.gutterWidth, viewHeight);

      textCtx.fillStyle = "#0d1117";
      textCtx.fillRect(0, 0, textWidth, viewHeight);

      // 2. Visible line range
      const startLine = Math.max(0, Math.floor(state.scrollY / state.lineHeight));
      const endLine = Math.min(state.lines.length - 1, Math.ceil((state.scrollY + viewHeight) / state.lineHeight));

      const { start: selStart, end: selEnd, length: selLen } = getSelectionRange();
      const activeLineIdx = indexToLineCol(state.selectionFocus).line;

      // Setup typography
      textCtx.font = `${state.fontSize}px ${FONT_FAMILY}`;
      textCtx.textBaseline = "middle";
      gutterCtx.font = `${Math.round(state.fontSize * 0.85)}px ${FONT_FAMILY}`;
      gutterCtx.textBaseline = "middle";

      for (let l = startLine; l <= endLine; l++) {
        const lineY = (l * state.lineHeight) - state.scrollY;
        const lineText = state.lines[l] || "";
        const lineStartOffset = state.lineStartOffsets[l];
        const lineEndOffset = lineStartOffset + lineText.length;

        // Current active line highlight
        if (l === activeLineIdx && selLen === 0) {
          textCtx.fillStyle = "rgba(255, 255, 255, 0.02)";
          textCtx.fillRect(0, lineY, textWidth, state.lineHeight);
        }

        // Gutter line number
        const isCurrentLine = (l === activeLineIdx);
        gutterCtx.fillStyle = isCurrentLine ? "var(--accent)" : "#484f58";
        gutterCtx.textAlign = "right";
        gutterCtx.fillText(`${l + 1}`, state.gutterWidth - 14, lineY + (state.lineHeight / 2));

        // Selection Highlight on this line
        if (selLen > 0 && selEnd > lineStartOffset && selStart <= lineEndOffset) {
          const selColStart = Math.max(0, selStart - lineStartOffset);
          const selColEnd = Math.min(lineText.length + 1, selEnd - lineStartOffset);

          const selX = (selColStart * state.charWidth) - state.scrollX + 16;
          const selW = (selColEnd - selColStart) * state.charWidth;

          textCtx.fillStyle = "rgba(56, 139, 253, 0.28)";
          textCtx.fillRect(selX, lineY + 2, selW, state.lineHeight - 4);
        }

        // Line Text
        textCtx.textAlign = "left";
        textCtx.fillStyle = "#e6edf3";
        const textX = 16 - state.scrollX;
        textCtx.fillText(lineText, textX, lineY + (state.lineHeight / 2));

        // Caret Cursor (if no range is selected)
        if (selLen === 0 && l === activeLineIdx) {
          const col = state.selectionFocus - lineStartOffset;
          const caretX = textX + (col * state.charWidth);
          textCtx.fillStyle = "#58a6ff";
          textCtx.fillRect(caretX, lineY + 2, 2, state.lineHeight - 4);
        }
      }

      updateStatusUI();
    }

    function updateStatusUI() {
      const { line, col } = indexToLineCol(state.selectionFocus);
      statCursor.textContent = `Ln ${line + 1}, Col ${col + 1} (Pos #${state.selectionFocus.toLocaleString()})`;

      const { length } = getSelectionRange();
      if (length > 0) {
        statSelection.style.display = 'block';
        statSelection.textContent = `${length.toLocaleString()} selected`;
        btnDelete.disabled = false;
        btnDelete.textContent = `Delete (${length.toLocaleString()})`;
      } else {
        statSelection.style.display = 'none';
        btnDelete.disabled = true;
        btnDelete.textContent = `Delete`;
      }
    }

    // --- 3. MOUSE COORDINATES TO LINE/COL HIT-TESTING ---
    function getIndexFromMouse(clientX, clientY) {
      const rect = textCanvas.getBoundingClientRect();
      const relY = clientY - rect.top + state.scrollY;
      const relX = clientX - rect.left + state.scrollX - 16;

      const line = Math.max(0, Math.min(state.lines.length - 1, Math.floor(relY / state.lineHeight)));
      const col = Math.max(0, Math.min(state.lines[line].length, Math.round(relX / state.charWidth)));

      return lineColToIndex(line, col);
    }

    // --- 4. BACKEND INTEGRATION (READ, INSERT, DELETE, UNDO, REDO) ---
    async function fetchFullText() {
      try {
        showToast("Syncing with backend Piece Table...");
        const res = await fetch(`${BACKEND_URL}/text`);
        if (!res.ok) throw new Error("Backend HTTP " + res.status);
        const data = await res.json();
        state.fullText = data.text || "";
        reindexLines();
        render();
        showToast("Connected to Piece Table (Authoritative)");
      } catch (err) {
        showToast("⚠️ Could not connect to Spring Boot backend: " + err.message);
      }
    }

    async function apiInsert(pos, text) {
      if (state.isBusy) return;
      state.isBusy = true;
      showToast("Inserting text into Piece Table...");

      try {
        const res = await fetch(`${BACKEND_URL}/insert`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ position: pos, text: text })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        await fetchFullText();

        state.selectionAnchor = pos + text.length;
        state.selectionFocus = pos + text.length;
        ensureCursorVisible();
        render();
        showToast("Inserted successfully");
      } catch (err) {
        showToast("Error inserting: " + err.message);
      } finally {
        state.isBusy = false;
      }
    }

    async function apiDelete() {
      const { start, length } = getSelectionRange();
      if (length === 0 || state.isBusy) return;
      state.isBusy = true;
      showToast(`Deleting ${length} characters...`);

      try {
        const res = await fetch(`${BACKEND_URL}/delete`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ position: start, length: length })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        await fetchFullText();

        state.selectionAnchor = start;
        state.selectionFocus = start;
        ensureCursorVisible();
        render();
        showToast("Deleted successfully");
      } catch (err) {
        showToast("Error deleting: " + err.message);
      } finally {
        state.isBusy = false;
      }
    }

    async function apiUndo() {
      if (state.isBusy) return;
      state.isBusy = true;
      showToast("Undoing operation...");

      try {
        const res = await fetch(`${BACKEND_URL}/undo`, { method: "POST" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        await fetchFullText();

        const desc = data.description || {};
        const pos = Math.min(state.totalChars, desc.position || 0);
        state.selectionAnchor = state.selectionFocus = pos;
        ensureCursorVisible();
        render();
        showToast(desc.details || "Undo completed");
      } catch (err) {
        showToast("Undo failed: " + err.message);
      } finally {
        state.isBusy = false;
      }
    }

    async function apiRedo() {
      if (state.isBusy) return;
      state.isBusy = true;
      showToast("Redoing operation...");

      try {
        const res = await fetch(`${BACKEND_URL}/redo`, { method: "POST" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        await fetchFullText();

        const desc = data.description || {};
        const pos = Math.min(state.totalChars, desc.position || 0);
        state.selectionAnchor = state.selectionFocus = pos;
        ensureCursorVisible();
        render();
        showToast(desc.details || "Redo completed");
      } catch (err) {
        showToast("Redo failed: " + err.message);
      } finally {
        state.isBusy = false;
      }
    }

    // --- 5. INTERACTIVE EVENT HANDLERS ---
    textCanvas.addEventListener('mousedown', (e) => {
      editorContainer.focus();
      if (e.button === 0) {
        const idx = getIndexFromMouse(e.clientX, e.clientY);
        state.isSelecting = true;
        if (e.shiftKey) {
          state.selectionFocus = idx;
        } else {
          state.selectionAnchor = state.selectionFocus = idx;
        }
        render();
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (state.isSelecting) {
        state.selectionFocus = getIndexFromMouse(e.clientX, e.clientY);
        render();
      }
    });

    window.addEventListener('mouseup', () => {
      if (state.isSelecting) {
        state.isSelecting = false;
        render();
      }
    });

    editorContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      state.scrollY += e.deltaY;
      state.scrollX += e.deltaX;
      clampScroll();
      render();
    }, { passive: false });

    // Keyboard navigation & typing
    window.addEventListener('keydown', (e) => {
      const isCtrlOrCmd = e.ctrlKey || e.metaKey;

      // Undo / Redo
      if (isCtrlOrCmd && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        apiUndo();
        return;
      }
      if ((isCtrlOrCmd && e.shiftKey && (e.key === 'z' || e.key === 'Z')) || (isCtrlOrCmd && (e.key === 'y' || e.key === 'Y'))) {
        e.preventDefault();
        apiRedo();
        return;
      }

      // Font size
      if (isCtrlOrCmd && (e.key === '=' || e.key === '+')) {
        e.preventDefault();
        changeZoom(2);
        return;
      }
      if (isCtrlOrCmd && (e.key === '-' || e.key === '_')) {
        e.preventDefault();
        changeZoom(-2);
        return;
      }

      if (document.activeElement === editorContainer) {
        const { line, col } = indexToLineCol(state.selectionFocus);
        const { length: selLen } = getSelectionRange();

        // Arrow Right
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          const next = Math.min(state.totalChars, state.selectionFocus + 1);
          if (e.shiftKey) {
            state.selectionFocus = next;
          } else {
            state.selectionAnchor = state.selectionFocus = (selLen > 0 ? getSelectionRange().end : next);
          }
          ensureCursorVisible();
          render();
          return;
        }

        // Arrow Left
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          const prev = Math.max(0, state.selectionFocus - 1);
          if (e.shiftKey) {
            state.selectionFocus = prev;
          } else {
            state.selectionAnchor = state.selectionFocus = (selLen > 0 ? getSelectionRange().start : prev);
          }
          ensureCursorVisible();
          render();
          return;
        }

        // Arrow Down
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          const nextLine = Math.min(state.lines.length - 1, line + 1);
          const nextIdx = lineColToIndex(nextLine, col);
          if (e.shiftKey) {
            state.selectionFocus = nextIdx;
          } else {
            state.selectionAnchor = state.selectionFocus = nextIdx;
          }
          ensureCursorVisible();
          render();
          return;
        }

        // Arrow Up
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          const prevLine = Math.max(0, line - 1);
          const prevIdx = lineColToIndex(prevLine, col);
          if (e.shiftKey) {
            state.selectionFocus = prevIdx;
          } else {
            state.selectionAnchor = state.selectionFocus = prevIdx;
          }
          ensureCursorVisible();
          render();
          return;
        }

        // Home
        if (e.key === 'Home') {
          e.preventDefault();
          const lineStart = isCtrlOrCmd ? 0 : state.lineStartOffsets[line];
          if (e.shiftKey) {
            state.selectionFocus = lineStart;
          } else {
            state.selectionAnchor = state.selectionFocus = lineStart;
          }
          ensureCursorVisible();
          render();
          return;
        }

        // End
        if (e.key === 'End') {
          e.preventDefault();
          const lineEnd = isCtrlOrCmd ? state.totalChars : state.lineStartOffsets[line] + state.lines[line].length;
          if (e.shiftKey) {
            state.selectionFocus = lineEnd;
          } else {
            state.selectionAnchor = state.selectionFocus = lineEnd;
          }
          ensureCursorVisible();
          render();
          return;
        }

        // Backspace / Delete
        if (e.key === 'Backspace' || e.key === 'Delete') {
          e.preventDefault();
          if (selLen > 0) {
            apiDelete();
          } else if (e.key === 'Backspace' && state.selectionFocus > 0) {
            state.selectionAnchor = state.selectionFocus - 1;
            apiDelete();
          } else if (e.key === 'Delete' && state.selectionFocus < state.totalChars) {
            state.selectionAnchor = state.selectionFocus + 1;
            apiDelete();
          }
          return;
        }

        // Enter Key: Insert New Line!
        if (e.key === 'Enter') {
          e.preventDefault();
          if (selLen > 0) {
            (async () => {
              await apiDelete();
              await apiInsert(state.selectionFocus, "\n");
            })();
          } else {
            apiInsert(state.selectionFocus, "\n");
          }
          return;
        }

        // Tab Key: Insert 4 spaces
        if (e.key === 'Tab') {
          e.preventDefault();
          apiInsert(state.selectionFocus, "    ");
          return;
        }

        // Printable text typing
        if (!isCtrlOrCmd && !e.altKey && e.key.length === 1) {
          e.preventDefault();
          if (selLen > 0) {
            (async () => {
              await apiDelete();
              await apiInsert(state.selectionFocus, e.key);
            })();
          } else {
            apiInsert(state.selectionFocus, e.key);
          }
        }
      }
    });

    // Zoom Buttons
    function changeZoom(delta) {
      state.fontSize = Math.max(12, Math.min(48, state.fontSize + delta));
      measureFont();
      resizeCanvases();
    }

    btnZoomIn.addEventListener('click', () => changeZoom(2));
    btnZoomOut.addEventListener('click', () => changeZoom(-2));
    btnUndo.addEventListener('click', () => apiUndo());
    btnRedo.addEventListener('click', () => apiRedo());
    btnDelete.addEventListener('click', () => apiDelete());

    // Scrollbar Dragging
    let isDraggingThumb = false;
    let thumbStartY = 0;
    let scrollStartY = 0;

    vThumb.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      isDraggingThumb = true;
      thumbStartY = e.clientY;
      scrollStartY = state.scrollY;
      vThumb.classList.add('dragging');
    });

    window.addEventListener('mousemove', (e) => {
      if (isDraggingThumb) {
        const viewHeight = editorContainer.clientHeight;
        const totalHeight = (state.lines.length * state.lineHeight) + 120;
        const thumbHeight = parseFloat(vThumb.style.height) || 28;
        const usable = viewHeight - thumbHeight;

        if (usable > 0) {
          const deltaY = e.clientY - thumbStartY;
          const ratio = deltaY / usable;
          state.scrollY = scrollStartY + (ratio * getMaxScrollY());
          clampScroll();
          render();
        }
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDraggingThumb) {
        isDraggingThumb = false;
        vThumb.classList.remove('dragging');
      }
    });

    window.addEventListener('resize', resizeCanvases);

    // Bootstrap
    async function init() {
      measureFont();
      resizeCanvases();
      await fetchFullText();
      editorContainer.focus();
    }

    init();
  </script>
</body>
</html>
